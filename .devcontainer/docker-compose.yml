version: '3.8'
services:
  devcontainer:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace      
    network_mode: service:minio
    command: sleep infinity
    environment:
      AWS_ACCESS_KEY_ID: ocfltest
      AWS_SECRET_ACCESS_KEY: ocfltest
      AWS_REGION: us-east-1
      OCFL_TEST_S3: "http://minio:9000"

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    volumes:
      - minio-data:/data
    command: server /data
    environment:
      MINIO_ROOT_USER: ocfltest
      MINIO_ROOT_PASSWORD: ocfltest

volumes:
  minio-data:
