name: 'go' 
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer and run tests
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/ocfl-go-devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/ocfl-go-devcontainer
          eventFilterForPush: pull_request
          runCmd: |
            
            # check go.mod is clean
            go mod tidy
            if ! git diff --exit-code --quiet; then
              echo "go mod tidy was not updated first"
              exit 1
            fi

            # The repo builds for windows too (fs/local's atomic Write relies
            # on os.Root.Rename being a replacing rename there), but CI only
            # runs linux. Cross-compile vet is the cheap check that nothing
            # windows-only has broken.
            GOOS=windows go vet ./...

            go test ./... -count=5 -race